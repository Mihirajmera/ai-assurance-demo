# The LiteLLM gateway the release agent's model calls go through. Mostly hardened, with two gaps
# left in on purpose: no spend cap, and the image below is pinned by tag, not digest.
model_list:
  - model_name: claude
    litellm_params:
      model: anthropic/claude-sonnet-5-5
      api_key: os.environ/ANTHROPIC_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  store_model_in_db: false
  store_prompts_in_spend_logs: false
  disable_env_credential_login: true
  max_request_size_mb: 25
  allowed_file_extensions: [".txt", ".md"]

litellm_settings:
  success_callback: [prometheus]
  turn_off_message_logging: true
